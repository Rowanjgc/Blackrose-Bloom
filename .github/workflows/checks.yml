name: Code health

on:
  # Branches are checked through their pull request; pushing to a PR branch
  # used to run every job twice (once for push, once for pull_request).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR supersedes the running checks. Runs on main
# are never cancelled, so every commit that lands keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix animation-runtime
      - run: npm run build --prefix animation-runtime
      - run: npm ci --prefix ui-runtime
      - run: npm run build --prefix ui-runtime
      - run: npm test --prefix ui-runtime
      - run: npm ci --prefix diagram-runtime
      - run: npm run build --prefix diagram-runtime
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # GTK is exercised separately; offline tests import no graphical runtime.
      - run: uv sync --locked --no-install-package PyGObject --no-install-package pycairo
      - run: .venv/bin/python scripts/check_health.py
      - run: uv build --out-dir artifacts/dist
      - run: .venv/bin/python scripts/check_distribution.py artifacts/dist

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READING_ROOM_SCREENSHOTS: artifacts/browser/reading-room
      MODEL_PICKER_SCREENSHOTS: artifacts/browser/model-picker
      CITATION_SCREENSHOTS: artifacts/browser/citations
      EDIT_REVIEW_SCREENSHOTS: artifacts/browser/edit-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --no-install-package PyGObject --no-install-package pycairo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix ui-runtime
      - run: npm run build --prefix ui-runtime
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm ci --prefix diagram-runtime
      - run: npm run build --prefix diagram-runtime
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-review
          path: artifacts/browser
          retention-days: 14

  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BLACKROSE_TEST_WEBKIT: '1'
      GDK_BACKEND: x11
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config xvfb dbus-x11 bubblewrap libseccomp2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked
      - run: npm ci --prefix animation-runtime
      - run: npm run build --prefix animation-runtime
      - run: npm ci --prefix ui-runtime
      - run: npm run build --prefix ui-runtime
      - run: npm ci --prefix diagram-runtime
      - run: npm run build --prefix diagram-runtime
      - run: xvfb-run -a dbus-run-session -- .venv/bin/python scripts/check_health.py --gui-only --report-dir artifacts/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-review
          path: |
            artifacts/native
            /tmp/motion-canvas-review
            /tmp/blackrose-*.png
            /tmp/blackrose-*.html
          retention-days: 14
