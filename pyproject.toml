[project]
name = "blackrose-bloom"
version = "0.2.0"
description = "Gothic Bloom desktop chat with llama-router, native Retriever, and skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "tomlkit>=0.13,<1",
    "httpx>=0.27",
    # Security floor: earlier bundles trust emSign roots with compromised
    # intermediate keys (GHSA-6q48-6c7w-9gw2); 2026.10.19 restores the rest.
    "certifi>=2026.10.19",
    "chardet>=5.2",
    "lxml>=5.4",
    "readability-lxml>=0.8.1",
    "pywebview>=5",
    "PyGObject>=3.50; sys_platform == 'linux'",
    "markdown-it-py>=4.1",
    "mdit-py-plugins>=0.5",
    "latex2mathml>=3.77",
    "pygments>=2.17",
    "pyyaml>=6",
    "jsonschema>=4",
    # Retriever's validated native CPU stack. No MCP service is required.
    "sentence-transformers==6.1.0",
    "transformers==5.19.0",
    "torch>=2.6",
    "sqlite-vec==0.1.9",
    "mcp==2.2.0",
    "pypdf>=6.21.2,<7",
    "beautifulsoup4>=4.13,<5",
    "pillow>=13,<14",
    "torchvision>=0.21",
    "httpcore>=1,<2",
    "reportlab>=4.4,<5",
]

[project.scripts]
blackrose = "blackrose.main:main"
blackrose-bloom = "blackrose.main:main"
bloom-knowledge = "local_knowledge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackrose", "src/local_knowledge"]
artifacts = ["src/blackrose/gui/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src", "skills", "animation-runtime", "ui-runtime", "diagram-runtime", "tests", "scripts", "docs",
    "README.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", "hatch_build.py",
    "config.example.toml", "CONTEXT.md",
    "GOTHIC_BLOOM_DESIGN_LANGUAGE.md", "package.json", "package-lock.json",
    ".python-version", ".editorconfig", "run",
]
artifacts = [
    "src/blackrose/gui/static/motion-canvas-runtime.js",
    "src/blackrose/gui/static/motion-canvas-NOTICES.txt",
    "animation-runtime/exports.json",
    "src/blackrose/gui/static/ui-runtime.js",
    "src/blackrose/gui/static/ui-contract.json",
    "src/blackrose/gui/static/ui-NOTICES.txt",
    "src/blackrose/gui/static/mermaid-host.html",
    "src/blackrose/gui/static/mermaid-manifest.json",
    "src/blackrose/gui/static/mermaid-NOTICES.txt",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint]
# Correctness and unused-import checks, plus bug-prone constructs (B),
# modernization (UP), cheap performance guards (PERF), and event-loop hazards.
# ASYNC109: explicit timeout arguments implement public/third-party contracts.
# ASYNC110: poll external state where no in-process event can signal changes.
# ASYNC220/221/240: scratch diagnostics and isolated tests perform synchronous
# setup/assertions; they are not application hot paths. Production I/O is checked.
select = ["F", "E9", "B", "UP", "PERF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/test_web.py" = ["ASYNC109"]
"tests/test_composer_drafts.py" = ["ASYNC110"]
"tests/test_effort.py" = ["ASYNC110"]
"tests/test_edit_backups.py" = ["ASYNC221", "ASYNC240"]
"tests/test_cloud_animations.py" = ["ASYNC240"]
"tests/test_library.py" = ["ASYNC240"]
"tests/test_reply_checkpoints.py" = ["ASYNC240"]
"tests/test_router_service.py" = ["ASYNC240"]
"tests/test_security_boundaries.py" = ["ASYNC240"]
"tests/test_workspace.py" = ["ASYNC240"]
"scripts/check_animation_model.py" = ["ASYNC240"]
"scripts/check_gui_accessibility_tasks.py" = ["ASYNC110"]
"scripts/check_gui_interactive_ui.py" = ["ASYNC110"]
"scripts/check_illustration_model.py" = ["ASYNC240"]
"scripts/check_recovery.py" = ["ASYNC221", "ASYNC240"]
"scripts/check_router_child_auth.py" = ["ASYNC109", "ASYNC240"]
"scripts/check_router_deployed_contract.py" = ["ASYNC109", "ASYNC240"]
"scripts/check_shared_router.py" = ["ASYNC110", "ASYNC220", "ASYNC221"]
"scripts/check_xiaohei_generation.py" = ["ASYNC240"]
"scripts/measure_housekeeping.py" = ["ASYNC240"]

[tool.mypy]
files = [
    "src/blackrose/citations.py",
    "src/blackrose/clock_context.py",
    "src/blackrose/storage/records.py",
    "src/blackrose/storage/repository.py",
    "src/blackrose/prompts.py",
    "src/blackrose/diagrams.py",
    "src/blackrose/diagram_repairs.py",
    "src/blackrose/repairs.py",
    "src/blackrose/tool_execution.py",
    "src/blackrose/tool_host.py",
    "src/blackrose/outbound.py",
    "src/blackrose/gui/external.py",
    "src/blackrose/gui/bridge.py",
    "src/blackrose/gui/session.py",
    "src/blackrose/turns.py",
    "src/blackrose/instance.py",
    "src/blackrose/ui_documents.py",
    "src/blackrose/interactive_answers.py",
    "src/blackrose/memory.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
